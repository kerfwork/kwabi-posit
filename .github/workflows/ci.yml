name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  body:
    name: Body tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build and run the body tests
        env:
          CXX: clang++
        run: make test
